<text x="54" y="853" font-size="13" fill="#ece6d8">1  Réveil dans la cellule du laboratoire. Panne, alarmes, les portes s'ouvrent.</text>
<text x="54" y="872" font-size="13" fill="#ece6d8">2  Fuir vers les blocs de cellules : émeute, première arme de fortune.</text>
<text x="54" y="891" font-size="13" fill="#ece6d8">3  Ouvrir la chambre des reliques, scellée : courant (machines), badge (officiers) ou conduits.</text>
<text x="54" y="910" font-size="13" fill="#ece6d8">4  Récupérer sa combinaison de Veilleur. Les glyphes, la capsule : premiers indices.</text>
<text x="54" y="929" font-size="13" fill="#ece6d8">5  Passer le vide : la coursive éventrée ou la coque extérieure.</text>
<text x="54" y="948" font-size="13" fill="#ece6d8">6  Hangar : gardes contre pirates, voler la navette.   7  Décoller, puis la carte de la galaxie.</text>
