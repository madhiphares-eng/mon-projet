<text x="40" y="52" font-size="26" font-weight="700" fill="#f2b26b">Prologue : plan du vaisseau-prison</text>
<text x="40" y="80" font-size="15" fill="#a7a3b4">Vu de dessus, proue à gauche. Plan de travail pour les formes grises : les tailles ne sont pas à l'échelle.</text>
