<text x="1052" y="428" font-size="16" font-weight="700" fill="#ffd2c8">Coursive éventrée</text><text x="1052" y="448" font-size="12.5" fill="#ffd2c8">Ouverte sur le vide par l'abordage</text><text x="1052" y="466" font-size="12.5" fill="#ffd2c8">Combinaison obligatoire</text>
