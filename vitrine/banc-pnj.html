function redimensionner() {

  rendu.setSize(l, h); camera.aspect = l / h; camera.updateProjectionMatrix();

function url(cle) {
  const nom = cle.split('/')[1], chemin = `${cle}/${nom}.glb`;
  if (fichiers) { const f = fichiers.get(chemin); return f ? URL.createObjectURL(f) : null; }
  return RACINE ? new URL(chemin, RACINE).href : null;
}

// --- les mesures -----------------------------------------------------------------
const reIgnorer = /(end|nub|_end|top_end|null|ik|pole|target|ctrl|twist|roll)$/i;
function trouverOs(os, motifs) { return os.find(b => motifs.every(m => m.test(b.name))); }
const GAUCHE = /(left|_l$|\.l$|_l_|^l_|\bl\b|lft)/i;
function osHumains(os) {
  const n = b => b.name.replace(/^mixamorig[:_]?/i, '');
  const avec = re => os.filter(b => re.test(n(b)) && !reIgnorer.test(n(b)));
  return {
    hanches: avec(/hips|pelvis|root|cog/i)[0],
    tete: avec(/head/i)[0],
    brasG: avec(/(upper_?arm|arm)/i).filter(b => !/fore|lower/i.test(n(b))).find(b => GAUCHE.test(n(b))),
    mainG: avec(/hand|wrist/i).find(b => GAUCHE.test(n(b))),
    jambeG: avec(/(up_?leg|thigh|upperleg|leg)/i).find(b => GAUCHE.test(n(b))),
  };
}
function boite(objet) { objet.updateMatrixWorld(true); return new THREE.Box3().setFromObject(objet, true); }

async function charger(p) {
  const lien = url(p.cle);
  if (!lien) return { ...p, absent: true };
  const t0 = performance.now();
  const gltf = await new Promise((ok, ko) => chargeur.load(lien, ok, undefined, ko)).catch(e => ({ erreur: e.message || String(e) }));
  if (gltf.erreur) return { ...p, erreur: gltf.erreur };
  const racine = gltf.scene;
  // les pièces parasites (le portail géant d'un pirate, un socle), comme dans l'atelier (docs/prologue/tailles-modeles.json)
  const parasites = []; racine.traverse(n => { if ((p.retirer || []).some(r => n.name.startsWith(r))) parasites.push(n); });
  parasites.forEach(n => n.parent && n.parent.remove(n));
  const reposOs = []; racine.traverse(o => { if (o !== racine) reposOs.push([o, o.position.clone(), o.quaternion.clone()]); });
  let faces = 0, maillages = 0, souples = 0;
  const textures = new Set(), materiaux = new Set(), os = new Set();
  racine.traverse(o => {
    if (!o.isMesh) return;
    maillages++; if (o.isSkinnedMesh) { souples++; o.skeleton.bones.forEach(b => os.add(b)); }
    const g = o.geometry; faces += (g.index ? g.index.count : g.attributes.position.count) / 3;
    o.frustumCulled = false;
    for (const m of [].concat(o.material)) { materiaux.add(m); for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap']) if (m[k]?.image) textures.add(m[k].image); }
  });
  const listeOs = [...os];
  const b0 = boite(racine), taille0 = b0.getSize(new THREE.Vector3());
  const hum = osHumains(listeOs);
  // pose de départ : angle du bras gauche avec l'horizontale (T ≈ 0°, A ≈ 35-50°, bras le long du corps ≈ 80-90°)
  let pose = '—';
  if (hum.brasG && hum.mainG) {
    const a = hum.brasG.getWorldPosition(new THREE.Vector3()), m = hum.mainG.getWorldPosition(new THREE.Vector3());
    const d = m.sub(a), ang = THREE.MathUtils.radToDeg(Math.atan2(Math.abs(d.y), Math.hypot(d.x, d.z)));
    pose = ang < 20 ? `T (${ang.toFixed(0)}°)` : ang < 60 ? `A (${ang.toFixed(0)}°)` : `bras baissés (${ang.toFixed(0)}°)`;
  }
  // les animations : est-ce que ça bouge, est-ce que ça avance, est-ce que ça boucle
  const mixeur = new THREE.AnimationMixer(racine);
  const anims = [];
  // on suit tous les nœuds (os ou pièces rigides : beaucoup de robots sont animés pièce par pièce, sans squelette)
  const noeuds = []; racine.traverse(o => { if (o !== racine) noeuds.push(o); });
  const pas = Math.max(1, Math.floor(noeuds.length / 400));
  const suivis = noeuds.filter((o, i) => i % pas === 0);
  const positions = () => suivis.map(b => b.getWorldPosition(new THREE.Vector3()));
  const repos = positions();
  const dim0 = Math.max(taille0.x, taille0.y, taille0.z) || 1;
  for (const clip of gltf.animations) {
    const action = mixeur.clipAction(clip); action.reset().play();
    const echant = [], boites = [];
    for (let i = 0; i <= 8; i++) {
      mixeur.setTime(clip.duration * i / 8); racine.updateMatrixWorld(true);
      echant.push(positions()); if (i % 4 === 0) boites.push(boite(racine));
    }
    action.stop();
    let mouvement = 0, ecartBoucle = 0, ecartRepos = 0;
    for (let k = 0; k < suivis.length; k++) {
      for (const e of echant) mouvement = Math.max(mouvement, e[k].distanceTo(echant[0][k]));
      ecartBoucle = Math.max(ecartBoucle, echant[8][k].distanceTo(echant[0][k]));
      ecartRepos = Math.max(ecartRepos, echant[0][k].distanceTo(repos[k]));
    }
    const c0 = boites[0].getCenter(new THREE.Vector3()), c2 = boites[2].getCenter(new THREE.Vector3());
    const avance = Math.hypot(c2.x - c0.x, c2.z - c0.z);
    const ech = Math.max(...boites.map(b => { const t = b.getSize(new THREE.Vector3()); return Math.max(t.x, t.y, t.z); })) / dim0;
    anims.push({ nom: clip.name || 'sans nom', duree: +clip.duration.toFixed(2), pistes: clip.tracks.length,
      mouvement: +(mouvement / Math.max(taille0.y, 1e-6)).toFixed(3), avance: +(avance / Math.max(taille0.y, 1e-6)).toFixed(3),
      boucle: +(ecartBoucle / Math.max(taille0.y, 1e-6)).toFixed(3), quittePose: +(ecartRepos / Math.max(taille0.y, 1e-6)).toFixed(3), echelle: +ech.toFixed(2) });
  }
  mixeur.stopAllAction(); reposOs.forEach(([o, p, qq]) => { o.position.copy(p); o.quaternion.copy(qq); }); racine.updateMatrixWorld(true);
  // mise à la taille voulue, pieds au sol (sur la pose de repos)
  const b1 = boite(racine), h1 = b1.getSize(new THREE.Vector3()).y || 1;
  const facteur = p.hauteur / h1;
  const groupe = new THREE.Group(); groupe.add(racine);
  racine.scale.multiplyScalar(facteur);
  const b2 = boite(groupe), c2 = b2.getCenter(new THREE.Vector3());
  racine.position.set(-c2.x, -b2.min.y + (p.vol || 0), -c2.z);
  const r = {
    ...p, objet: groupe, mixeur, clips: gltf.animations, actif: -1, repos: reposOs,
    faces: Math.round(faces), maillages, souples, os: listeOs.length, materiaux: materiaux.size, textures: textures.size,
    texMax: Math.max(0, ...[...textures].map(i => Math.max(i.width || 0, i.height || 0))),
    mixamo: listeOs.some(b => /^mixamorig/i.test(b.name)),
    humanoide: !!(hum.hanches && hum.tete && hum.brasG && hum.jambeG),
    tailleBrute: taille0.toArray().map(v => +v.toFixed(3)), minBrut: b0.min.toArray().map(v => +v.toFixed(5)), maxBrut: b0.max.toArray().map(v => +v.toFixed(5)), facteur: +facteur.toFixed(4), pose, anims,
    chargement: Math.round(performance.now() - t0),
  };
  if (p.vol && !gltf.animations.length) {
    // un drone : vol stationnaire, il monte et descend un peu et balaie la salle du regard (fait par le code, comme dans le jeu)
    const base = racine.position.clone(), base_q = racine.quaternion.clone();
    const t = [0, 1.2, 2.4, 3.6, 4.8], haut = [0, 0.06, 0, -0.06, 0];
    const lacets = [-25, 0, 25, 0, -25].map(d => base_q.clone().multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), d * Math.PI / 180)));
    const clip = new THREE.AnimationClip('Vol stationnaire (procédural)', 4.8, [
      new THREE.VectorKeyframeTrack(racine.uuid + '.position', t, t.flatMap((_, i) => [base.x, base.y + haut[i], base.z])),
      new THREE.QuaternionKeyframeTrack(racine.uuid + '.quaternion', t, lacets.flatMap(qq => qq.toArray())),
    ]);
    r.clips = [clip];
    r.anims = [{ nom: clip.name, duree: 4.8, pistes: 2, mouvement: 0.1, avance: 0, boucle: 0, quittePose: 0, echelle: 1 }];
  }
  r.verdict = juger(r);
  return r;
}

function juger(r) {
  const notes = [];
  let niveau = 'ok';
  const pire = n => { if (n === 'ko' || (n === 'attention' && niveau === 'ok')) niveau = n; };
  if (r.ecarte) { notes.push(`écarté : ${r.ecarte}`); pire('ko'); }
  if (r.note) { notes.push(r.note); pire('attention'); }
  const vivantes = r.anims.filter(a => a.mouvement > 0.01);
  if (!r.souples) {
    if (r.vol) notes.push('pas de squelette : normal pour un drone ; son vol stationnaire est fait par le code');
    else if (vivantes.length) notes.push('pas de squelette, mais animé pièce par pièce : utilisable tel quel, pas de Mixamo');
    else { notes.push('pas de squelette : statue, à faire rigger (Mixamo)'); pire('attention'); }
  }
  else if (r.reciblage?.cib) notes.push(`reçoit les ${biblio.clips.length} animations de la bibliothèque (reciblées sur son squelette)`);
  else if (r.reciblage) { notes.push(`ne reçoit pas la bibliothèque : il manque ${r.reciblage.manque.join(', ')}`); pire('attention'); }
  else if (!r.humanoide) notes.push(`squelette non humain (${r.os} os) : il ne prend pas les animations Mixamo, seulement les siennes`);
  else notes.push(`squelette humain, ${r.os} os${r.mixamo ? ', nommé façon Mixamo (animations Mixamo directes)' : ' (Unity : à régler en Humanoid à l’import)'}`);
  if (!r.anims.length) { notes.push('aucune animation'); if (r.souples) pire('attention'); }
  else if (!vivantes.length) {
    notes.push(r.anims.every(a => a.duree < 0.05) ? 'son « animation » n’est qu’une pose fixe (une image)' : 'les animations ne bougent pas'); pire('attention');
  }
  else notes.push(`${vivantes.length} animation${vivantes.length > 1 ? 's' : ''} qui bouge${vivantes.length > 1 ? 'nt' : ''} sur ${r.anims.length}`);
  for (const a of r.anims) {
    if (a.echelle > 1.6) { notes.push(`« ${a.nom} » grossit le modèle (×${a.echelle}) : unités à corriger`); pire('attention'); }

function cartographier(racine) {

  if (!ordre.length) return null;
  const noms = new Map(ordre.map(o => [o, lireNom(o.name)]));
  const prendre = (cle, os) => { if (!carte[cle]) carte[cle] = os; };
  for (const os of ordre) {
    const { cote, partie, brut, sansCote } = noms.get(os);
    if (/^(org|mch|tweak|ik|fk)/.test(brut) || /(fk|ik|mch|org|tweak)/.test(partie)) continue;
    const alias = ALIAS.find(([motif]) => motif.test(sansCote.replace(/\d+$/, '').replace(/[_.]+$/, '')) || motif.test(sansCote));
    if (alias && cote) { prendre(alias[1] + '_' + cote, os); continue; }

      if (aCote !== !!cote) continue;              // un os de côté pour un membre, un os central pour le reste
      prendre(aCote ? nom + '_' + cote : nom, os);

  const DOIGTS = { thumb: 'pouce', index: 'index', point: 'index', middle: 'majeur', mid: 'majeur', ring: 'annulaire', pinky: 'auriculaire', pink: 'auriculaire' };
  const PAR_RANG = ['pouce', 'index', 'majeur', 'annulaire', 'auriculaire'];
  for (const os of ordre) {
    const { cote, sansCote } = noms.get(os);

    let doigt = null, rang = null, m;
    if ((m = sansCote.match(/finger_?(\d)(\d)/))) { doigt = PAR_RANG[+m[1]]; rang = +m[2] + 1; }
    else if ((m = sansCote.match(/(thumb|index|point|middle|mid|ring|pinky|pink)[_.]?0?(\d)/))) { doigt = DOIGTS[m[1]]; rang = +m[2]; }
    if (doigt && rang >= 1 && rang <= 3) prendre(`${doigt}${rang}_${cote}`, os);
  }
  // une jambe nommée « leg » suivie d'un genou : leg est la cuisse
  for (const c of ['g', 'd']) {
    const leg = ordre.find(o => noms.get(o).partie === 'leg' && noms.get(o).cote === c);
    const genou = ordre.find(o => /knee$/.test(noms.get(o).sansCote) && noms.get(o).cote === c);
    if (leg && genou && carte['mollet_' + c] === genou) { carte['cuisse_' + c] = carte['cuisse_' + c] || leg; }
    else if (leg && genou) { carte['cuisse_' + c] = leg; carte['mollet_' + c] = genou; }
  }
  // un rig façon Rigify : spine (bassin), spine.001 à .003 (dos), .004-.005 (cou), .006 (tête)
  const colonnes = ordre.filter(o => noms.get(o).partie === 'spine' && !/(fk|ik|mch|org|tweak)/.test(noms.get(o).brut));
  if (!carte.hanches && colonnes.length >= 4) {
    carte.hanches = colonnes[0];
    if (!carte.tete) carte.tete = colonnes[colonnes.length - 1];
    if (!carte.cou) carte.cou = colonnes[colonnes.length - 2];

const SUITE = { clavicule: 'bras', bras: 'avantbras', avantbras: 'main', cuisse: 'mollet', mollet: 'pied', pied: 'orteil' };
const v = () => new THREE.Vector3(), q = () => new THREE.Quaternion();
// les paires d'os (source, cible), avec la direction de chaque os au repos, dans l'ordre de la hiérarchie de la cible
function apparier(src, cib) {
  const paires = [];
  const ajouter = (a, b, sa, sb) => {
    if (!a || !b) return;
    const da = sa ? sa.getWorldPosition(v()).sub(a.getWorldPosition(v())).normalize() : null;
    const db = sb ? sb.getWorldPosition(v()).sub(b.getWorldPosition(v())).normalize() : null;

    const j = nc === 1 ? ns - 1 : Math.round(i * (ns - 1) / (nc - 1));

    const suivC = C.colonne[i + 1] || C.cou || C.tete, suivS = S.colonne[j + 1] || S.cou || S.tete;
    ajouter(S.colonne[j], C.colonne[i], suivS, suivC);

  }
  for (const c of ['g', 'd']) for (const d of ['pouce', 'index', 'majeur', 'annulaire', 'auriculaire']) for (let n = 1; n <= 3; n++) {

function devant(carte) {   // le regard du squelette, à plat

function preparerCible(r) {

function recibler(r, nom) {

  r.mixeur.stopAllAction(); r.repos.forEach(([o, p, qq]) => { o.position.copy(p); o.quaternion.copy(qq); }); r.objet.updateMatrixWorld(true);

  const F = q().setFromUnitVectors(devant(source.carte), devant(prep.cib.carte)), Fi = F.clone().invert();
  for (const p of paires) {

}

async function chargerBiblio() {
  for (const chemin of BIBLIO) {
    let lien = null;
    if (fichiers) { const f = fichiers.get(chemin); lien = f ? URL.createObjectURL(f) : null; }
    else if (RACINE) lien = new URL(chemin, RACINE).href;
    if (!lien) continue;
    const gltf = await new Promise((ok, ko) => chargeur.load(lien, ok, undefined, ko)).catch(() => null);
    if (!gltf) continue;
    gltf.scene.updateMatrixWorld(true);
    const source = { racine: gltf.scene, mixeur: new THREE.AnimationMixer(gltf.scene), ...cartographier(gltf.scene) };
    for (const clip of gltf.animations) {
      if (/tpose/i.test(clip.name) || biblio.sources.has(clip.name)) continue;
      biblio.sources.set(clip.name, { clip, source });
      biblio.clips.push(clip.name);
    }
  }
  biblio.clips.sort();
}

// --- la rangée -------------------------------------------------------------------------
function ranger() {
  let x = 0, campPrec = null;
  const etiquettes = [];
  for (const r of bancs) {
    if (!r.objet) continue;
    if (campPrec && campPrec !== r.camp) x += 1.6;
    campPrec = r.camp;
    const larg = Math.max(0.9, boite(r.objet).getSize(new THREE.Vector3()).x);
    r.objet.position.x = x + larg / 2; r.x = x + larg / 2;
    scene.add(r.objet); x += larg + 0.5;
  }
  // silhouette de 1,80 m au début de la rangée
  if (!scene.getObjectByName('repere')) {
  const repere = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.36, 4, 12), new THREE.MeshStandardMaterial({ color: 0x86efe6, transparent: true, opacity: 0.35 }));
  repere.position.set(-1, 0.9, 0); repere.name = 'repere'; scene.add(repere);
  }
  // on cadre le début de la rangée (le héros et les détenus) ; un clic sur un nom cadre le personnage
  const vu = Math.min(x, 16);
  camera.position.set(vu / 2 - 1, 2.2, vu * 0.95 + 3); orbite.target.set(vu / 2 - 1, 1.0, 0); orbite.update();

function jouerPourTous(nom) {

}

  const tout = document.createElement('button'); tout.textContent = 'Tout voir'; tout.className = 'tout'; tout.onclick = () => { window.banc.seul(null); ranger(); }; liste.append(tout);

      d.innerHTML = `<b>${nom}</b> <span class="${r.verdict.niveau}">●</span><div class="meta">« ${r.titre} », ${r.auteur} · ${Math.round(r.faces / 1000)} k faces · ${r.textures} textures (max ${r.texMax} px) · pose ${r.pose}</div>

function cadrer(r) {
  const b = boite(r.objet), c = b.getCenter(new THREE.Vector3()), t = b.getSize(new THREE.Vector3());
  const d = Math.max(t.y, t.x) * 1.9 + 0.8;

}

async function lancer() {
  document.querySelector('#etat').textContent = 'Chargement…';
  for (const r of bancs.splice(0)) if (r.objet) scene.remove(r.objet);
  for (const p of PNJ) {
    if (SEULEMENT && !SEULEMENT.split(',').includes(p.cle.split('/')[1])) continue;
    const r = await charger(p);
    bancs.push(r);
    document.querySelector('#etat').textContent = `Chargement… ${bancs.length} / ${PNJ.length}`;
  }
  bancs.sort((a, b) => ORDRE.indexOf(a.camp) - ORDRE.indexOf(b.camp));
  ranger();
  document.querySelector('#etat').textContent = 'Chargement de la bibliothèque d’animations…';
  await chargerBiblio();
  for (const r of bancs) {
    if (!r.objet) continue;
    if (r.souples) r.reciblage = preparerCible(r);
    r.verdict = juger(r);
    if (r.reciblage?.cib && biblio.sources.has('Idle_Loop')) jouerBiblio(r, 'Idle_Loop', true);

  remettre(r); r.objet.updateMatrixWorld(true);                 // au repos : on mesure les mains et le regard
  r.prise = new Prise(C, r.objet);
  r.prise.noterPeau();
  r.armes = {};
  const fusil = fabriquerArme('fusil'); fusil.visible = false; scene.add(fusil); r.armes.fusil = fusil;
  const instants = INSTANTS_VISEE.filter(i => biblio.sources.has(i.clip));
  if (instants.length) r.calibrage = calibrerAppui(r.prise, fusil, i => poserA(r, i.clip, i.u), instants);
  // le pistolet : il suit l'avant-bras, le bot vérifie seulement qu'il ne finit pas dans le corps
  if (biblio.sources.has('Pistol_Aim_Neutral')) {
    const pistolet = fabriquerArme('pistolet'); pistolet.visible = false; scene.add(pistolet); r.armes.pistolet = pistolet;
    let pire = 9;
    for (const u of [0.2, 0.7]) { const t = poserA(r, 'Pistol_Aim_Neutral', u); pire = Math.min(pire, r.prise.mesurer(pistolet, r.prise.tenir(pistolet, t, u)).traverse); }
    const peau = jugerPeau(r.prise, [0.2, 0.7].map(u => () => r.prise.tenir(pistolet, poserA(r, 'Pistol_Aim_Neutral', u), u)));
    const raison = pire < -0.02 ? 'le pistolet finit dans son corps' : peau.raison;
    if (raison) r.prise.inapte = { ...(r.prise.inapte || {}), pistolet: true, raison: r.prise.inapte?.raison || raison };
  }
  if (actif) jouerBiblio(r, actif, true);
}
function placerArme(r) {
  const tenue = r.biblioActif ? tenuePour(r.biblioActif) : null;
  const C = r.reciblage?.cib?.carte;
  const tenir = !!(tenue && C?.main_d && C?.bras_d && C?.main_g && r.objet.visible && armes);
  if (r.armes) for (const a of Object.values(r.armes)) a.visible = false;
  if (!tenir) return;
  if (!r.prise) preparerPrise(r);
  if (r.prise.inapte?.[tenue.arme]) return;     // le bot l'a jugé inapte à cette arme : pas de pose cassée à l'écran
  if (!r.armes[tenue.arme]) { r.armes[tenue.arme] = fabriquerArme(tenue.arme); scene.add(r.armes[tenue.arme]); }
  const arme = r.armes[tenue.arme];
  const action = r.mixeur.existingAction(r.clipActif);
  const u = action ? (action.time % r.clipActif.duration) / r.clipActif.duration : 0;
  r.objet.updateMatrixWorld(true);
  r.dernierePrise = r.prise.tenir(arme, tenue, u);
  arme.visible = true;
}
let armes = true;                                // les armes et leur prise (désactivables pour comparer)

// le bot : chaque personnage, chaque animation d'arme, huit instants ; il mesure ce qui ne va pas
function controlerPrises(clips) {
  const rapport = [];
  for (const r of bancs) {
    const C = r.reciblage?.cib?.carte;
    if (!r.objet || !C?.main_d || !C?.main_g || r.ecarte) continue;
    if (!r.prise) preparerPrise(r);
    const perso = { cle: r.cle, nom: r.cle.split('/')[1], camp: r.camp, appui: r.prise.appui, doigts: !!r.prise.mains.d?.normale, inapte: r.prise.inapte, calibrage: r.calibrage, clips: {} };
    for (const clip of clips) {
      const tenue = tenuePour(clip);
      if (!tenue || !biblio.sources.has(clip)) continue;
      const arme = r.armes[tenue.arme] || (r.armes[tenue.arme] = fabriquerArme(tenue.arme), scene.add(r.armes[tenue.arme]), r.armes[tenue.arme]);
      const pire = { mainDroite: 0, mainGauche: 0, etirementDroit: 0, etirementGauche: 0, coudeDroit: 180, coudeGauche: 180, traverse: 9, glisse: 0, cout: 0, peau: 0, dechirure: 0 };
      for (let k = 0; k < 8; k++) {
        const u = k / 8;
        poserA(r, clip, u);
        const res = r.prise.tenir(arme, tenue, u);
        const m = r.prise.mesurer(arme, res);
        pire.mainDroite = Math.max(pire.mainDroite, m.mainDroite);
        if (m.mainGauche !== null && (!tenue.gauche || tenue.gauche(u) > 0.99)) pire.mainGauche = Math.max(pire.mainGauche, m.mainGauche);
        pire.etirementDroit = Math.max(pire.etirementDroit, m.etirementDroit);
        if (m.etirementGauche !== null) pire.etirementGauche = Math.max(pire.etirementGauche, m.etirementGauche);
        pire.coudeDroit = Math.min(pire.coudeDroit, m.coudeDroit);
        if (m.coudeGauche !== null) pire.coudeGauche = Math.min(pire.coudeGauche, m.coudeGauche);
        pire.traverse = Math.min(pire.traverse, m.traverse);
        pire.glisse = Math.max(pire.glisse, Math.abs(m.glisse));
        pire.cout = Math.max(pire.cout, coutPose(m));
        const pz = r.prise.peau();
        if (pz) { pire.peau = Math.max(pire.peau, pz.mainDroite ?? 9, pz.mainGauche ?? 9); pire.dechirure = Math.max(pire.dechirure, pz.dechirure); }
      }
      perso.clips[clip] = pire;
    }
    rapport.push(perso);
    remettre(r);
    if (r.biblioActif) jouerBiblio(r, r.biblioActif, true);
  }
  return rapport;
}

(function boucle() {
  requestAnimationFrame(boucle);
  const dt = horloge.getDelta();
  for (const r of bancs) {
    if (!r.mixeur || !r.clipActif) continue;
    if (figer === null) r.mixeur.update(dt);
    else r.mixeur.setTime(r.clipActif.duration * figer);
    placerArme(r);
  }
  rendu.render(scene, camera);
})();

// pour les tests automatiques
window.banc = {
  pret: false, bancs, cadrer: i => cadrer(bancs[i]), figer: f => { figer = f; },
  rapport: () => bancs.map(({ objet, mixeur, clips, repos, reciblage, clipActif, ...r }) => ({ ...r, reciblable: !!reciblage?.cib, manque: reciblage?.manque || null })),
  biblio: () => biblio.clips.slice(),
  pourTous: nom => jouerPourTous(nom),
  jouerBiblio: (i, nom) => jouerBiblio(bancs[i], nom),
  vue: (x, y, z, cx, cy, cz) => { camera.position.set(x, y, z); orbite.target.set(cx, cy, cz); orbite.update(); },
  jouer: (i, a) => jouer(bancs[i], a),
  plein: () => { plein = true; document.querySelector('#panneau').style.display = 'none'; redimensionner(); },
  camp: camp => {
    const du = bancs.filter(r => r.objet && camp.split(',').includes(r.camp) && !r.ecarte);
    bancs.forEach(r => { if (r.objet) r.objet.visible = du.includes(r); });
    const b = new THREE.Box3(); du.forEach(r => b.union(boite(r.objet)));
    const c = b.getCenter(new THREE.Vector3()), t = b.getSize(new THREE.Vector3());
    const d = Math.max(t.x / camera.aspect, t.y) * 1.25 / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) + 1;
    camera.position.set(c.x, c.y + t.y * 0.1, d); orbite.target.copy(c); orbite.update();
  },
  seul: i => bancs.forEach((r, j) => { if (r.objet) r.objet.visible = i === null || i === j; }),
  controlerPrises: clips => controlerPrises(clips),
  armes: oui => { armes = oui; },
  prise: i => { const r = bancs[i]; return r.prise ? { appui: r.prise.appui, calibrage: r.calibrage, derniere: r.dernierePrise && r.prise.mesurer(Object.values(r.armes).find(a => a.visible) || r.armes.fusil, r.dernierePrise) } : null; },
};
if (RACINE) lancer();
</script>
