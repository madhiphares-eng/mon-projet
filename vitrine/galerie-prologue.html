<style>

  #liste h2 { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--brume); margin: 14px 16px 4px; font-weight: 600; }
  #liste button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; color: var(--ivoire); font: inherit; font-size: 14px; padding: 5px 16px; cursor: pointer; }
  #liste button:hover { background: rgba(236, 230, 216, 0.06); }
  #liste button.actif { background: rgba(242, 178, 107, 0.14); color: var(--ambre); }
  #liste button i { width: 7px; height: 7px; border-radius: 50%; background: #555; flex: none; }
  #liste button.present i { background: var(--ether); }
  #liste button.absent { color: var(--brume); }
  #choix { display: none; }
  #fiche { position: fixed; left: 306px; bottom: 16px; max-width: min(560px, calc(100vw - 340px)); background: var(--fond); border: 1px solid var(--trait); padding: 12px 14px; font-size: 13px; line-height: 1.5; }
  #fiche h3 { margin: 0 0 2px; font-size: 18px; }
  #fiche .usage { color: var(--ivoire); margin: 2px 0 6px; }
  #fiche .meta { color: var(--brume); }
  #fiche a { color: var(--ether); }
  #fiche .anims button { background: none; border: 1px solid var(--trait); color: var(--ivoire); font: inherit; font-size: 12px; padding: 3px 8px; margin: 6px 4px 0 0; cursor: pointer; }
  #fiche .anims button.actif { border-color: var(--ambre); color: var(--ambre); }
  #aide { position: fixed; right: 14px; top: 14px; font-size: 12px; background: rgba(6, 7, 12, 0.6); padding: 6px 10px; text-align: right; }
  #chargement { position: fixed; left: 290px; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-size: 13px; letter-spacing: 2px; color: var(--brume); opacity: 0; transition: opacity 0.2s; }

  #message { position: fixed; left: 290px; right: 0; top: 40%; text-align: center; padding: 0 24px; color: var(--brume); line-height: 1.6; display: none; }
  #erreur { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 32px; text-align: center; background: #05060b; line-height: 1.6; }
  @media (max-width: 760px) {
    #liste { display: none; }
    #choix { display: block; position: fixed; left: 16px; right: 16px; top: 12px; font-size: 15px; padding: 8px; background: #111; color: var(--ivoire); border: 1px solid var(--trait); }

    #aide { display: none; }
    #chargement, #message { left: 0; }
  }
</style>

es","uid":"1b91aca44b65417f957d9ec30ce8ee19"},{"dossier":"13-Armes","nom":"pistolet-use","titre":"Sci-Fi Pistol","auteur":"Andrei Milin","compte":"milinam2002","faces":17452,"anims":0,"usage":"Pistolet usé, trouvé en route","uid":"fab28aeb14894752b49149ef00926aff"},{"dossier":"13-Armes","nom":"cle-a-molette","titre":"Weathered Wrench (Game Model)","auteur":"Michael Makivic","compte":"makivic","faces":2642,"anims":0,"usage":"Arme de fortune : clé à molette","uid":"66b29c557ce04bb0b14bdde2cc204a2f"},{"dossier":"14-Accessoires","nom":"extincteur","titre":"Fire Extinguisher","auteur":"Loïc","compte":"loichuet1","faces":2792,"anims":0,"usage":"Extincteur","uid":"5676b179b3b744c0aaae53a3dcea2300"},{"dossier":"14-Accessoires","nom":"neons","titre":"Fluorescent Light Fixtures - 4x 4096px²","auteur":"Mark Peters","compte":"mark-peters","faces":21456,"anims":0,"usage":"Néons de plafond","uid":"2a05034d61dc49bf81b33de44add7aa8"},{"dossier":"14-Accessoires","nom":"caisse-munitions","titre":"Sci-Fi crate / ammunition box (2)","auteur":"ul1tka","compte":"ul1tka","faces":648,"anims":0,"usage":"Caisse de munitions","uid":"342efe4d70f94d37a4edd66a15c39502"},{"dossier":"14-Accessoires","nom":"caisse-cargo","titre":"Sci-fi cargo crate","auteur":"andreas9343","compte":"andreas9343","faces":4052,"anims":0,"usage":"Caisse de cargo","uid":"ac36898521304e51a8e305aa602f1f5b"},{"dossier":"15-Reliques","nom":"capsule-veilleur","titre":"Sci-Fi Coffin — Cryo Casket | sarcophagus","auteur":"UNREAL JOELAB","compte":"Unreal_Joelab","faces":197961,"anims":0,"usage":"La capsule où il dormait depuis des milliers d'années, gardée dans le laboratoire","uid":"ffebf6fb62c840d08b0311ba6b8f9536"},{"dossier":"15-Reliques","nom":"chambre-stase","titre":"Stasis / Clone Chamber (with animations)","auteur":"TampaJoey","compte":"TampaJoey","faces":28528,"anims":1,"usage":"Chambre d'étude du laboratoire de l'empire (animée)","uid":"8738f78ae4ec4630ac35a4783303ea95"},{"dossier":"15-Reliques","nom":"coeur-relique","titre":"Ancient Relic","auteur":"FDU_oficial","compte":"FDU_oficial","faces":18172,"anims":1,"usage":"Le cœur d'hyperespace du vaisseau-prison : une relique des Bâtisseurs qui s'emballe à son réveil (animé)","uid":"c93820e31f1b4a79a6a94269ed9f41b7"},{"dossier":"15-Reliques","nom":"tablette-glyphes","titre":"Lost Alien Technology","auteur":"Citron Legacy","compte":"CitronLegacy","faces":44,"anims":0,"usage":"Tablette de glyphes qu'il lit sans savoir pourquoi","uid":"c56fc34b2bd74b098b7ea68b6bcf215c"},{"dossier":"15-Reliques","nom":"anneau-relais","titre":"Alien Ring","auteur":"Cogent","compte":"koron","faces":1530,"anims":0,"usage":"Anneau d'un relais d'hyperespace des Bâtisseurs","uid":"9c288fb496ab4d15838c0517d0cef47c"},{"dossier":"15-Reliques","nom":"cristal-ether","titre":"Void-Touched Crystal Rock","auteur":"PuzzledPapaya","compte":"PuzzledPapaya","faces":674,"anims":0,"usage":"Cristal d'Éther brut","uid":"2eee63550ed6470dac7659211a605795"},{"dossier":"15-Reliques","nom":"prisme-ether","titre":"Prism of Enlightenment","auteur":"Duznot","compte":"duz_vr","faces":5054,"anims":0,"usage":"Cristal d'Éther taillé, où l'on devine des glyphes","uid":"25c72b016ace4f7aac72c5974437c5f2"}];
const DOSSIERS = {
  '01-Joueur': 'Le héros', '02-Prisonniers': 'Détenus', '03-Gardes': 'Gardes', '04-Pirates': 'Pirates', '05-Cellules': 'Cellules',
  '06-Couloirs': 'Coursives', '07-Consigne': 'Consigne', '08-Machines': 'Salle des machines', '09-Informatique': 'Informatique',
  '10-Hangar': 'Hangar', '11-Vaisseaux': 'Vaisseaux', '12-Exterieur': 'Sas et vide', '13-Armes': 'Armes', '14-Accessoires': 'Accessoires', '15-Reliques': 'Reliques des Bâtisseurs',
};

// Dossier des modèles : ./prologue/ à côté de cette page, ou ?models=chemin
const RACINE = new URL((new URLSearchParams(location.search).get('models') || 'prologue').replace(/\/?$/, '/'), location.href);
const $ = s => document.querySelector(s);

if (location.protocol === 'file:') {
  const e = $('#erreur');
  e.style.display = 'flex';
  e.innerHTML = 'Cette page doit être servie par un petit serveur local (le navigateur bloque les fichiers ouverts directement).<br>' +
    'Dans le Terminal : <b>cd ~/jeu && python3 -m http.server 8766</b><br>puis ouvrir <b>http://localhost:8766/galerie-prologue.html</b>';
  throw new Error('file://');
}

// ------------------------------------------------------------------ scène : studio neutre, sol, silhouette de 1,80 m

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15161b);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 50000);
const controles = new OrbitControls(camera, renderer.domElement);
controles.enableDamping = true;

const soleil = new THREE.DirectionalLight(0xffffff, 1.6);
soleil.castShadow = true;
soleil.shadow.mapSize.set(2048, 2048);
scene.add(soleil, soleil.target, new THREE.HemisphereLight(0xcfd6e6, 0x2a2622, 0.35));

const sol = new THREE.Mesh(new THREE.CircleGeometry(1, 64), new THREE.MeshStandardMaterial({ color: 0x24262c, roughness: 0.95 }));
sol.rotation.x = -Math.PI / 2;
sol.receiveShadow = true;
scene.add(sol);
const grille = new THREE.GridHelper(1, 10, 0x3a3d46, 0x2c2e35);
scene.add(grille);

// repère d'échelle : une silhouette de 1,80 m (les modèles glTF sont en mètres)
const humain = new THREE.Group();
const matHumain = new THREE.MeshStandardMaterial({ color: 0x86efe6, transparent: true, opacity: 0.35, roughness: 0.6 });
const corps = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.1, 6, 16), matHumain); corps.position.y = 0.77;
const tete = new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 14), matHumain); tete.position.y = 1.67;
humain.add(corps, tete);
scene.add(humain);

function redimensionner() {
  const l = innerWidth > 760 ? 290 : 0;
  renderer.setSize(innerWidth - l, innerHeight);
  renderer.domElement.style.marginLeft = l + 'px';
  camera.aspect = (innerWidth - l) / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', redimensionner);
redimensionner();

// ------------------------------------------------------------------ liste et disponibilité des fichiers

const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
const chemins = m => [`${m.dossier}/${m.nom}/${m.nom}.glb`, `${m.dossier}/${m.nom}/scene.gltf`, `${m.dossier}/${m.nom}/scene.glb`];
async function trouver(m) {
  for (const c of chemins(m)) {
    try { const r = await fetch(new URL(c, RACINE), { method: 'HEAD' }); if (r.ok) return c; } catch { }
  }
  return null;
}

const boutons = [];
let dossierCourant = null;
MODELES.forEach((m, i) => {
  if (m.dossier !== dossierCourant) {
    dossierCourant = m.dossier;
    const h = document.createElement('h2');
    h.textContent = DOSSIERS[m.dossier] || m.dossier;
    $('#liste').append(h);
    const g = document.createElement('optgroup');
    g.label = DOSSIERS[m.dossier] || m.dossier;
    $('#choix').append(g);
  }
  const b = document.createElement('button');
  b.innerHTML = '<i></i>';
  b.append(m.nom);
  b.onclick = () => ouvrir(i);
  $('#liste').append(b);
  boutons.push(b);
  const o = document.createElement('option');
  o.value = i; o.textContent = m.nom;
  $('#choix').lastElementChild.append(o);
});
$('#choix').onchange = e => ouvrir(Number(e.target.value));

Promise.all(MODELES.map(async (m, i) => {
  m.chemin = await trouver(m);
  boutons[i].classList.toggle('present', !!m.chemin);
  boutons[i].classList.toggle('absent', !m.chemin);
})).then(() => {
  const n = MODELES.filter(m => m.chemin).length;
  $('#liste .compte').textContent = `${n} modèles téléchargés sur ${MODELES.length}`;
  if (n === 0) {
    $('#message').style.display = 'block';
    $('#message').innerHTML = `Aucun modèle trouvé dans <b>${RACINE.pathname}</b>.<br>Télécharge-les d'abord avec <b>outils/telecharger-prologue.sh</b> (voir docs/PROLOGUE-MODELES.md).`;
  }
});

// ------------------------------------------------------------------ affichage d'un modèle

let actuel = -1, objet = null, mixer = null, jeton = 0;
const horloge = new THREE.Clock();

function liberer(o) {
  o.traverse(n => {
    if (n.geometry) n.geometry.dispose();
    for (const mat of [].concat(n.material || [])) {
      for (const v of Object.values(mat)) if (v && v.isTexture) v.dispose();
      mat.dispose();
    }
  });
}

function nombre(n) { return (n || 0).toLocaleString('fr-FR'); }

async function ouvrir(i) {
  i = (i + MODELES.length) % MODELES.length;
  actuel = i;
  const m = MODELES[i], moi = ++jeton;
  boutons.forEach((b, k) => b.classList.toggle('actif', k === i));
  boutons[i].scrollIntoView({ block: 'nearest' });
  $('#choix').value = i;
  if (objet) { scene.remove(objet); liberer(objet); objet = null; mixer = null; }
  if (m.chemin === undefined) m.chemin = await trouver(m);
  const fiche = $('#fiche');
  fiche.hidden = false;
  fiche.innerHTML = `<h3>${m.nom}</h3><div class="usage">${m.usage}</div>
    <div class="meta">« ${m.titre} » par ${m.auteur} · CC BY · <a href="https://sketchfab.com/3d-models/${m.uid}" target="_blank" rel="noopener">voir sur Sketchfab</a><br>
    ${nombre(m.faces)} faces<span class="taille"></span></div><div class="anims"></div>`;
  $('#message').style.display = m.chemin ? 'none' : 'block';
  if (!m.chemin) {
    $('#message').innerHTML = `<b>${m.nom}</b> n'est pas encore téléchargé.<br>Relance <b>outils/telecharger-prologue.sh</b> : il ne prend que ce qui manque.`;
    return;
  }
  $('#chargement').classList.add('visible');
  try {
    const gltf = await new GLTFLoader().setDRACOLoader(draco).loadAsync(new URL(m.chemin, RACINE).href);
    if (moi !== jeton) { liberer(gltf.scene); return; }
    objet = gltf.scene;
    objet.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
    // posé sur le sol, centré, à son échelle d'origine
    let b = new THREE.Box3().setFromObject(objet);
    const c = b.getCenter(new THREE.Vector3());
    objet.position.set(-c.x, -b.min.y, -c.z);
    scene.add(objet);
    b = new THREE.Box3().setFromObject(objet);
    const t = b.getSize(new THREE.Vector3());
    const rayon = Math.max(t.length() / 2, 0.3);
    fiche.querySelector('.taille').textContent = ` · ${t.x.toFixed(2)} × ${t.y.toFixed(2)} × ${t.z.toFixed(2)} m dans le fichier`;
    // décor à l'échelle du modèle
    sol.scale.setScalar(rayon * 3);
    grille.scale.setScalar(rayon * 4);
    humain.position.set(b.max.x + Math.max(0.6, rayon * 0.15), 0, 0);
    soleil.position.set(rayon * 2, rayon * 3, rayon * 2);
    Object.assign(soleil.shadow.camera, { left: -rayon * 2, right: rayon * 2, top: rayon * 2, bottom: -rayon * 2, near: 0.1, far: rayon * 10 });
    soleil.shadow.camera.updateProjectionMatrix();
    camera.near = rayon / 200; camera.far = rayon * 200; camera.updateProjectionMatrix();
    const cible = new THREE.Vector3(0, t.y / 2, 0);
    camera.position.copy(cible).add(new THREE.Vector3(1, 0.45, 1.2).normalize().multiplyScalar(rayon / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05));
    controles.target.copy(cible);
    controles.maxDistance = rayon * 20;
    controles.update();
    // animations du fichier
    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(objet);
      const zone = fiche.querySelector('.anims');
      gltf.animations.forEach((clip, k) => {
        const bt = document.createElement('button');
        bt.textContent = clip.name || `animation ${k + 1}`;
        bt.onclick = () => {
          mixer.stopAllAction();
          mixer.clipAction(clip).play();
          zone.querySelectorAll('button').forEach(x => x.classList.toggle('actif', x === bt));
        };
        zone.append(bt);
        if (k === 0) bt.click();
      });
    }
  } catch (e) {
    console.error(e);
    $('#message').style.display = 'block';
    $('#message').innerHTML = `Impossible de lire <b>${m.chemin}</b> : ${e.message}`;
  } finally {
    if (moi === jeton) $('#chargement').classList.remove('visible');
  }
}

addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); ouvrir(actuel + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); ouvrir(actuel - 1); }
});

renderer.setAnimationLoop(() => {
  const dt = Math.min(horloge.getDelta(), 0.05);
  if (mixer) mixer.update(dt);
  controles.update();
  renderer.render(scene, camera);
});

// premier modèle téléchargé, sinon le premier de la liste
setTimeout(() => ouvrir(Math.max(0, MODELES.findIndex(m => m.chemin))), 400);
</script>
